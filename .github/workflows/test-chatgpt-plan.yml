name: ChatGPT plan adapter

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/test-chatgpt-plan.yml'
      - 'dev/local-trial/**'
      - 'start_kanwas.command'
  push:
    branches: [chatgpt-plan]

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.11.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter shared build
      - run: pnpm --filter backend typecheck
      - run: pnpm --filter backend typecheck:chatgpt-plan
      - run: pnpm --filter backend test:chatgpt-plan
      - run: node --import tsx --test tests/sandbox/docker_build.test.ts
        working-directory: backend
      - run: node --test dev/local-trial/config.test.mjs
      - run: bash -n start_kanwas.command
